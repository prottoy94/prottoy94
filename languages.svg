<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Most used languages"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050508"/><stop offset="1" stop-color="#020203"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#7b61ff"/><stop offset="1" stop-color="#ff00c8"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient><linearGradient id="hline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset=".6" stop-color="#ff00c8" stop-opacity=".6"/><stop offset="1" stop-color="#ff00c8" stop-opacity="0"/></linearGradient><linearGradient id="numG" x1="0" y1="0" x2="0" y2="1"><stop offset=".2" stop-color="#ffffff"/><stop offset="1" stop-color="#00d4ff"/></linearGradient><linearGradient id="numP" x1="0" y1="0" x2="0" y2="1"><stop offset=".2" stop-color="#ffffff"/><stop offset="1" stop-color="#ff7ae0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="gcl1"><rect x="-2000" width="5000" height="4.5" y="-1000"><animate attributeName="y" dur="4s" begin="0.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.38;.40;.42;.82;.85;.88;.91;.94;1" values="-1000;26.4;31.9;-1000;25.1;30.5;33.9;27.8;-1000;-1000"/></rect></clipPath><clipPath id="gcl2"><rect x="-2000" width="5000" height="2.2" y="-1000"><animate attributeName="y" dur="4s" begin="0.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.39;.41;.43;.83;.86;.89;.92;.95;1" values="-1000;35.7;28.9;-1000;37.0;27.6;32.3;34.3;-1000;-1000"/></rect></clipPath><clipPath id="gcl3"><rect x="-2000" width="5000" height="6.8" y="-1000"><animate attributeName="y" dur="4s" begin="0.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.84;.87;.90;.93;.96;1" values="-1000;28.0;23.3;31.4;26.0;-1000;-1000"/></rect></clipPath><clipPath id="barClip"><rect x="25" y="62" width="450" height="10" rx="5"/></clipPath><linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>
.corner{animation:corner 3s ease-in-out infinite}
@keyframes corner{0%,100%{opacity:.35}50%{opacity:1}}
.gl{transform-box:fill-box;transform-origin:center}
.gr{animation:gr 4s infinite steps(1)}
.gc{animation:gc 4s infinite steps(1)}
.gm{animation:gm 4s infinite steps(1)}
.gs1{animation:gs1 4s infinite steps(1)}
.gs2{animation:gs2 4s infinite steps(1)}
.gs3{animation:gs3 4s infinite steps(1)}
@keyframes gr{0%,100%{transform:translate(-1px,0)}38%{transform:translate(-5px,1px)}40%{transform:translate(3px,0)}42%{transform:translate(-1px,0)}82%{transform:translate(-8px,1px) skewX(-12deg)}84%{transform:translate(5px,-1px)}86%{transform:translate(-10px,0) skewX(14deg)}88%{transform:translate(3px,1px)}90%{transform:translate(-6px,-1px) skewX(-6deg)}92%{transform:translate(4px,0)}94%{transform:translate(-1px,0)}}
@keyframes gc{0%,100%{transform:translate(1px,0)}38%{transform:translate(5px,-1px)}40%{transform:translate(-3px,0)}42%{transform:translate(1px,0)}82%{transform:translate(8px,-1px) skewX(12deg)}84%{transform:translate(-5px,1px)}86%{transform:translate(10px,0) skewX(-14deg)}88%{transform:translate(-3px,-1px)}90%{transform:translate(6px,1px) skewX(6deg)}92%{transform:translate(-4px,0)}94%{transform:translate(1px,0)}}
@keyframes gm{0%,100%{transform:none;opacity:1}39%{transform:translateX(2px);opacity:.8}41%{transform:none;opacity:1}83%{transform:skewX(-14deg) translateX(-3px);opacity:.75}85%{transform:skewX(8deg) translateX(2px);opacity:1}87%{transform:none;opacity:.4}89%{transform:scaleY(1.15);opacity:1}91%{transform:skewX(-5deg);opacity:.7}93%{transform:none;opacity:1}}
@keyframes gs1{0%,100%{transform:none}38%{transform:translateX(-14px)}40%{transform:translateX(10px)}42%{transform:none}82%{transform:translateX(-18px)}85%{transform:translateX(14px)}88%{transform:translateX(-24px)}91%{transform:translateX(9px)}94%{transform:none}}
@keyframes gs2{0%,100%{transform:none}39%{transform:translateX(20px)}41%{transform:translateX(-10px)}43%{transform:none}83%{transform:translateX(22px)}86%{transform:translateX(-16px)}89%{transform:translateX(12px)}92%{transform:translateX(-20px)}95%{transform:none}}
@keyframes gs3{0%,100%{transform:none}84%{transform:translateX(-10px)}87%{transform:translateX(18px)}90%{transform:translateX(-14px)}93%{transform:translateX(22px)}96%{transform:none}}
.rise{animation:rise .7s ease-out backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.spin,.spinr,.orbit,.halo{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 24s linear infinite}
.spinr{animation:spin 16s linear infinite reverse}
.orbit{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{animation:halo 2.6s ease-out infinite}
@keyframes halo{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
