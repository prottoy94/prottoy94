name: Update stats cards

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          # Optional: add a STATS_TOKEN secret (classic PAT, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py --user "${{ github.repository_owner }}" --out dist

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update stats cards"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" output
